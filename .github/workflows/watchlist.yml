# ---------------------------------------------------------------
# watchlist.yaml – hier kuratierst du, was in den Kalendern landet
# ---------------------------------------------------------------
settings:
  timezone: Europe/Berlin
  # Optionaler Zufalls-Zusatz im Dateinamen (Pages ist öffentlich!), z.B. "-k3x9q2"
  secret_suffix: ""
  refresh_hours: 6          # Empfehlung an den Kalender-Client
  base_url: ""              # leer = wird aus GITHUB_REPOSITORY abgeleitet

calendars:

  # ============================ FUSSBALL ============================
  - id: fcb-frauen
    name: "FC Bayern Frauen"
    emoji: "⚽"
    color: "#DC052D"
    alarm_minutes: 60
    sources:
      # Offizieller Vereins-Feed. URL holen: fcbayern.com -> Frauen -> Spielplan ->
      # "Kalender abonnieren" -> 1. Mannschaft -> Link kopieren (webcal://... ist ok)
      # und als GitHub-Secret FCB_FRAUEN_ICS_URL hinterlegen.
      - id: fcb-ics
        type: ics
        url_env: FCB_FRAUEN_ICS_URL
        # exclude_regex: "(?i)2\\. Mannschaft"   # falls der Feed beide Teams mischt

  - id: dfb-frauen
    name: "DFB Frauen-Nationalmannschaft"
    emoji: "⚽"
    color: "#000000"
    alarm_minutes: 60
    sources:
      - id: dfb-frauen-tabelle
        type: dfb_table
        url: https://www.dfb.de/frauen/nationalmannschaften/nationalmannschaft/spiele-und-termine
        include_regex: "Deutschland"
        include_ranges: false          # Turnier-Zeiträume (z.B. WM 2027) als Ganztages-Termin?
        duration_minutes: 120

  - id: dfb-maenner
    name: "DFB Männer-Nationalmannschaft"
    emoji: "⚽"
    color: "#CC0000"
    alarm_minutes: 60
    sources:
      # ACHTUNG: URL bitte im Browser prüfen (bei mir nicht verifiziert).
      # Erwartet: Tabelle mit Spalten Datum | Uhrzeit | Veranstaltung | Ort | TV
      - id: dfb-maenner-tabelle
        type: dfb_table
        url: https://www.dfb.de/maenner/nationalmannschaften/a-nationalmannschaft/spiele-und-termine
        include_regex: "Deutschland"
        include_ranges: false
        duration_minutes: 120

  # ============================ ESPORTS =============================
  - id: cs2-navi
    name: "CS2 – Natus Vincere"
    emoji: "🎮"
    color: "#F5C400"
    alarm_minutes: 15
    sources:
      - id: navi-pandascore
        type: pandascore
        team_name: "Natus Vincere"
        # team_id: 0     # optional fest eintragen (siehe: python build_calendars.py --resolve-teams)

  - id: cs2-big
    name: "CS2 – BIG"
    emoji: "🎮"
    color: "#E2001A"
    alarm_minutes: 15
    sources:
      - id: big-pandascore
        type: pandascore
        team_name: "BIG"
        # Bei Mehrdeutigkeit (BIG Academy etc.) team_id setzen!

  # =============================== DARTS ============================
  - id: darts
    name: "Darts – Top-Events & Highlights"
    emoji: "🎯"
    color: "#1E7B34"
    alarm_minutes: 60
    sources:
      # Kuratierte Majors als Ganztages-Termine (Quelle: Terminübersicht Darts Corner,
      # bitte gegen pdc.tv prüfen). Vergangenes wird beim Import automatisch ignoriert.
      - id: darts-majors
        type: static
        events:
          - { title: "PDC European Championship",          start: "2026-10-22", end: "2026-10-25" }
          - { title: "PDC Grand Slam of Darts",            start: "2026-11-14", end: "2026-11-22" }
          - { title: "PDC Players Championship Finals",    start: "2026-11-27", end: "2026-11-29" }
          - { title: "PDC World Darts Championship",       start: "2026-12-10", end: "2027-01-03" }

      # Einzelmatches von Aspinall / Bunting: hier eintragen, sobald die Auslosung/der
      # Order of Play bekannt ist (Zeiten in Europe/Berlin). Stabile UID = Titel+Start.
      - id: darts-aspinall-bunting
        type: static
        events: []
        # Beispiel:
        # - { title: "Aspinall vs. XY (Grand Slam, R1)", start: "2026-11-14 20:00", duration_minutes: 90,
        #     location: "Wolverhampton", description: "Sky Sports" }
