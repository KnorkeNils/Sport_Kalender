# Aktualisiert die Kalender automatisch. Benötigt KEINE Secrets.
name: Kalender aktualisieren

on:
  schedule:
    - cron: "17 */6 * * *"     # alle 6 Stunden (Minute 17, außerhalb der Stoßzeiten)
  workflow_dispatch:           # Button "Run workflow" für manuellen Start
  push:
    paths: ["watchlist.yaml", "build_calendars.py"]   # Änderungen an der Konfiguration -> sofort neu

permissions:
  contents: write              # nötig, damit der Lauf data/ und docs/ zurück ins Repo committen darf

concurrency:                   # nie zwei Läufe gleichzeitig (sonst Konflikte beim Commit)
  group: kalender
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Holt alle Quellen, mergt in data/events.json und schreibt docs/*.ics
      - run: python build_calendars.py

      # Nur committen, wenn sich etwas geändert hat. index.html enthält einen Zeitstempel,
      # daher gibt es bei jedem Lauf einen Commit – das hält das Repo "aktiv" und verhindert,
      # dass GitHub den Zeitplan nach 60 Tagen Inaktivität pausiert.
      - name: Ergebnis committen
        run: |
          git config user.name  "sport-kalender-bot"
          git config user.email "sport-kalender-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Kalender aktualisiert"
            git push
          fi
